<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocsRAG</title>
<style>
  :root { --bg:#f5f6fa; --card:#fff; --accent:#4f46e5; --text:#1f2430; --muted:#6b7280; --line:#e5e7eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1117; --card:#1a1d27; --text:#e6e8ee; --muted:#9aa1b2; --line:#2b3040; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text);
         display:flex; flex-direction:column; height:100vh; }
  header { padding:14px 20px; background:var(--card); border-bottom:1px solid var(--line);
           display:flex; align-items:center; gap:12px; }
  header h1 { font-size:18px; margin:0; }
  header small { color:var(--muted); }
  header .spacer { flex:1; }
  header a, header button { font-size:13px; color:var(--accent); background:none; border:1px solid var(--line);
           border-radius:8px; padding:6px 10px; cursor:pointer; text-decoration:none; }
  #chat { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:14px;
          max-width:820px; width:100%; margin:0 auto; }
  .msg { padding:12px 16px; border-radius:14px; max-width:90%; line-height:1.5; white-space:pre-wrap;
         overflow-wrap:anywhere; background:var(--card); border:1px solid var(--line); }
  .user { align-self:flex-end; background:var(--accent); color:#fff; border-color:var(--accent); }
  .error { border-color:#ef4444; color:#ef4444; }
  .sources { margin-top:10px; padding-top:8px; border-top:1px solid var(--line); font-size:12px;
             color:var(--muted); white-space:normal; }
  .chip { display:inline-block; margin:3px 4px 0 0; padding:2px 8px; border-radius:999px;
          border:1px solid var(--line); }
  .hint { text-align:center; color:var(--muted); margin-top:10%; }
  .examples { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:14px; }
  .examples button { border:1px solid var(--line); background:var(--card); color:var(--text);
                     border-radius:999px; padding:6px 12px; cursor:pointer; font-size:13px; }
  form { display:flex; gap:10px; padding:14px 20px; max-width:820px; width:100%; margin:0 auto; }
  textarea { flex:1; resize:none; padding:12px; border-radius:12px; border:1px solid var(--line);
             background:var(--card); color:var(--text); font:inherit; }
  form button { padding:0 22px; border:0; border-radius:12px; background:var(--accent); color:#fff;
                font-weight:600; cursor:pointer; }
  form button:disabled { opacity:.5; cursor:wait; }
</style>
</head>
<body>
<header>
  <h1>DocsRAG</h1><small>Ask questions about your documents</small>
  <span class="spacer"></span>
  <button id="reindex" title="Rebuild the index from the documents folder">Re-index</button>
  <a href="/docs" target="_blank">API docs</a>
</header>
<div id="chat">
  <div class="hint" id="hint">
    Ask anything about the indexed documents.
    <div class="examples" id="examples"></div>
  </div>
</div>
<form id="form">
  <textarea id="q" rows="2" maxlength="1000" placeholder="Type your question (Enter to send, Shift+Enter for a new line)"></textarea>
  <button id="send" type="submit">Ask</button>
</form>
<script>
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("q");
const send = document.getElementById("send");
const EXAMPLES = ["When was the Royal University of Warsaw established?",
                  "What did Luther need to do to avoid excommunication?",
                  "Who was Nikola Tesla?"];

for (const text of EXAMPLES) {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = text;
  b.onclick = () => { input.value = text; form.requestSubmit(); };
  document.getElementById("examples").appendChild(b);
}

function addMessage(text, cls) {
  document.getElementById("hint")?.remove();
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function addSources(div, sources) {
  if (!sources.length) return;
  const box = document.createElement("div");
  box.className = "sources";
  box.append("Sources: ");
  for (const s of sources) {
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.textContent = `${s.source} #${s.chunk_index} · ${s.score.toFixed(2)}`;
    box.appendChild(chip);
  }
  div.appendChild(box);
}

async function call(path, body) {
  const resp = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) {
    const d = data.detail;
    throw new Error(typeof d === "string" ? d : "Invalid request");
  }
  return data;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const question = input.value.trim();
  if (!question) return;
  input.value = "";
  addMessage(question, "user");
  const pending = addMessage("Thinking…", "bot");
  send.disabled = true;
  try {
    const data = await call("/ask", { question });
    pending.textContent = data.answer;
    addSources(pending, data.sources);
  } catch (err) {
    pending.textContent = err.message;
    pending.classList.add("error");
  } finally {
    send.disabled = false;
    chat.scrollTop = chat.scrollHeight;
    input.focus();
  }
});

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});

document.getElementById("reindex").onclick = async () => {
  const msg = addMessage("Re-indexing documents…", "bot");
  try {
    const r = await call("/ingest");
    msg.textContent = `Indexed ${r.documents} documents into ${r.chunks} chunks.`;
  } catch (err) {
    msg.textContent = err.message;
    msg.classList.add("error");
  }
};
</script>
</body>
</html>
